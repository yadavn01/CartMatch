name: scrape prices

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 06:00 NZST / 07:00 NZDT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape
        env:
          WOOLWORTHS_COOKIE: ${{ secrets.WOOLWORTHS_COOKIE }}
        run: npm run scrape

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "prices: $(date -u +%Y-%m-%d)"
            git push
          fi
